name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt flake8

      - name: Syntax check
        run: python -m py_compile ise_tacacs_cutover.py

      - name: Lint
        run: flake8 ise_tacacs_cutover.py --max-line-length=120 --extend-ignore=E501,W503

      - name: Verify no real secrets committed
        run: |
          if grep -rniE '(sharedsecret|password)\s*[:=]\s*[A-Za-z0-9@#$%]{6,}' --include="*.py" --include="*.csv" .; then
            echo "Possible hardcoded secret found - failing build"
            exit 1
          fi
